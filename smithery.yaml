# Smithery configuration for Portal da Transparência: Repasse de Verba
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_portal_transparencia_repasse

name: portal_transparencia_repasse-mcp
displayName: "Portal da Transparência: Repasse de Verba"
description: >
  Portal da Transparência: Repasse de Verba, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/portal_transparencia_repasse-mcp
repository: https://github.com/mcp-dir/portal_transparencia_repasse-mcp

tags:
  - portal_transparencia_repasse
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_portal_transparencia_repasse

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_portal_transparencia_repasse/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
